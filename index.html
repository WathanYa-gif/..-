<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>โลกโซเชียลจำลอง</title>
<style>
:root{--bg:#15202b;--card:#1e2732;--card2:#253341;--line:#2f3b4a;--tx:#e7edf3;--mute:#8b98a5;--acc:#1d9bf0;--acc2:#7856ff;--ok:#00ba7c;--warn:#ffd400;--bad:#f4212e}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Noto Sans Thai","Sarabun",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:660px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:0 0 calc(72px + env(safe-area-inset-bottom))}
.pad{padding:14px}
.row{display:flex;align-items:center;gap:10px}.row.top{align-items:flex-start}.wrap{flex-wrap:wrap}.gap{gap:8px}.grow{flex:1;min-width:0}
.mute{color:var(--mute)}.sm{font-size:12.5px}.center{text-align:center}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 14px}
details.card>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸";color:var(--mute)}details[open].card>summary::before{content:"▾"}
.btn{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
.btn:hover{filter:brightness(1.15)}.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.q{background:linear-gradient(135deg,var(--acc2),#c04bff);border:0;color:#fff;font-weight:600;padding:7px 14px}
.btn.q.pulse{animation:pl 1.6s infinite}@keyframes pl{50%{box-shadow:0 0 0 6px rgba(120,86,255,.28)}}
.btn.dng{color:#ff7b84}.btn.sm{padding:4px 12px;font-size:13px}
.icon{background:none;border:0;color:var(--mute);font-size:19px;cursor:pointer;padding:4px 8px}
.fld{display:block;margin:10px 0}.fld>span{display:block;font-size:13px;color:#b8c4d0;margin-bottom:3px;font-weight:600}.fld>small{display:block;color:var(--mute);font-size:12px;margin-bottom:4px}
.inp{width:100%;background:#0f1721;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;resize:vertical}
.inp:focus{outline:2px solid var(--acc);border-color:transparent}
.hdr{position:sticky;top:0;z-index:5;background:rgba(21,32,43,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.25);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs>div{display:flex;width:100%;max-width:660px}
.tabs button{flex:1;background:none;border:0;color:var(--mute);height:56px;padding:6px 0 4px;font:inherit;font-size:11px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tabs button b{display:block;font-size:19px;font-weight:400;line-height:1.2}.tabs button.on{color:var(--acc)}.tabs button.on:before{content:'';position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 4px 4px;background:var(--acc)}
.badge{position:absolute;top:4px;left:56%;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:700}
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--acc2);color:#fff;font-weight:700;overflow:hidden;flex:none;cursor:pointer}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:transparent}
.post{padding:12px 14px;border-bottom:1px solid var(--line)}.post.mine{background:rgba(29,155,240,.07)}.post.new{border-left:3px solid var(--acc2)}
.post.hl{animation:hl 2s}@keyframes hl{0%{background:rgba(255,212,0,.25)}}
.who b{cursor:pointer}.txt{white-space:pre-wrap;word-break:break-word;margin:2px 0 4px}
.acts{display:flex;gap:22px;color:var(--mute);font-size:13.5px;margin-top:4px}.acts span{cursor:pointer}
.reps{margin:8px 0 0 0;border-left:2px solid var(--line);padding-left:10px}
.rep{padding:6px 0;display:flex;gap:8px}.rep .txt{margin:0;font-size:14.5px}
.img-ph{margin:6px 0;padding:22px 12px;border-radius:12px;background:linear-gradient(135deg,#2a3b50,#3a2f55);color:#c9d3df;font-size:13.5px;text-align:center}
.pimg{max-width:100%;border-radius:12px;margin:6px 0;display:block;max-height:340px}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:12px;margin:2px 4px 2px 0}
.pill.tag{background:rgba(244,33,46,.15);border-color:rgba(244,33,46,.5);color:#ff9aa1}
.bar{height:9px;background:#0f1721;border-radius:99px;overflow:hidden;border:1px solid var(--line)}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar.cap>i{background:linear-gradient(90deg,#ffd400,#ff9d00)}
.thought{position:relative;background:#f4f1ff;color:#2a2340;border-radius:22px;padding:12px 16px;margin:6px 0 18px;font-style:italic}
.thought::after{content:"";position:absolute;left:30px;bottom:-14px;width:16px;height:16px;border-radius:50%;background:#f4f1ff}
.thought::before{content:"";position:absolute;left:20px;bottom:-26px;width:9px;height:9px;border-radius:50%;background:#f4f1ff}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);width:100%;max-width:660px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
#busy{position:fixed;inset:0;z-index:50;background:rgba(10,15,22,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#dfe8f1;text-align:center;padding:20px}
#busy.on{display:flex}.spin{width:42px;height:42px;border:4px solid #334; border-top-color:var(--acc2);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#toasts{position:fixed;top:12px;left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}

.banner{position:fixed;left:50%;top:10px;transform:translateX(-50%);width:calc(100% - 20px);max-width:640px;z-index:25;background:#06261f;border:1.5px solid #19c39a;border-radius:26px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.6);max-height:85vh;overflow:auto}
.banner.anim{animation:bnIn .45s cubic-bezier(.2,1.2,.4,1)}@keyframes bnIn{from{transform:translate(-50%,-130%);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.banner .xp{color:#ffd54a;font-size:26px}.up{color:#2ee6a6}.dn{color:#ff6b78}
.chip{display:inline-flex;align-items:center;gap:6px;background:#0b3a30;border:1px solid #19c39a55;border-radius:99px;padding:3px 12px;margin:3px 6px 3px 0;font-weight:600}.chip.dn{background:#3a1519;border-color:#ff6b7855}
.vbar{position:relative;height:9px;background:#0f1721;border:1px solid var(--line);border-radius:99px;overflow:hidden}.vbar:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:#556}.vbar i{position:absolute;top:0;bottom:0}.vbar .pos{background:#2ee6a6}.vbar .neg{background:#ff6b78}
.plus{width:36px;height:36px;border-radius:11px;background:#ff9500;color:#fff;border:0;font-size:22px;font-weight:700;cursor:pointer}.plus:disabled{opacity:.3;cursor:default}
.needTag{color:#ff9500;font-size:13px;font-weight:700}
.ms-row{display:flex;align-items:center;margin-top:8px;overflow-x:auto}.ms{min-width:34px;height:34px;border-radius:50%;background:#222a35;border:2px solid #2d3745;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}.ms.done{background:var(--acc);border-color:var(--acc)}.ms.cur{border-color:#ffd54a;color:#ffd54a}.msl{height:3px;min-width:12px;flex:1;background:#2d3745}

html{-webkit-text-size-adjust:100%}*{-webkit-tap-highlight-color:transparent}
button,[data-act]{touch-action:manipulation}
button{transition:transform .08s,filter .15s,background .15s,opacity .15s}button:active:not(:disabled){transform:scale(.96)}
.post .txt{overflow-wrap:anywhere}.post img,.pimg{max-width:100%}.post{transition:background .15s}
.acts{gap:18px}.acts span{padding:2px 0;transition:color .15s}
.view.fadein{animation:fi .22s ease-out}@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sheet.slidein{animation:su .24s cubic-bezier(.2,.9,.3,1)}@keyframes su{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pp .28s}@keyframes pp{40%{transform:scale(1.3)}}
.kb .tabs{display:none}
.toast{pointer-events:auto;background:#223;border:1px solid var(--line);padding:9px 16px;border-radius:12px;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:pre-wrap}
.toast.err{background:#3a1519;border-color:var(--bad)}.toast.ok{background:#0f3326;border-color:var(--ok)}
.intro{padding:26px 20px;font-size:17px;line-height:1.85}.intro p{margin:0 0 1.1em;animation:fi .8s both}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
.q-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card);cursor:pointer}.q-item.done{opacity:.45}.q-item.sel{border-color:var(--acc2)}
.saverow{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.warn{background:rgba(255,212,0,.1);border:1px solid rgba(255,212,0,.4);border-radius:10px;padding:8px 12px;font-size:13.5px;margin:10px 14px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.quote{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;cursor:pointer}.miniPost{border-top:1px solid var(--line);padding:8px 0;cursor:pointer}
.cnt{margin-left:auto;font-size:12px;color:var(--mute);font-weight:400}.over{color:#ff7b84!important;font-weight:700}
.composer{position:sticky;bottom:-16px;background:var(--bg);padding:8px 0 6px;border-top:1px solid var(--line);margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<div id="busy"><div class="spin"></div><div id="busyMsg" style="font-size:16px"></div><div class="mute sm" id="busySub"></div></div>
<input type="file" id="fileImport" accept=".json,application/json" hidden>
<input type="file" id="filePick" accept="image/*" hidden>
<script>
'use strict';
/* ================= util ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const uid=(p='i')=>p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,Number(n)||0));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const trunc=(s,n)=>{s=String(s||'').trim();return s.length>n?s.slice(0,n)+'…':s};
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setPath=(o,p,v)=>{const ks=p.split('.');const l=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[l]=v};
const clock=()=>String(rand(6,23)).padStart(2,'0')+':'+String(rand(0,59)).padStart(2,'0');
function toast(msg,type='',ms=3500){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),ms)}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('บันทึกลงเบราว์เซอร์ไม่ได้ (พื้นที่เต็ม?) ลองส่งออกข้อมูลสำรองไว้','err',6000);return false}}};
function readImage(file,max=480,q=.82){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function download(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* ================= state ================= */
const PRESETS={
 demo:{label:'โหมดทดสอบ (ไม่ใช้ AI — ข้อความสำเร็จรูป)',base:'',model:''},
 gemini:{label:'Google Gemini (มีรุ่นฟรี)',base:'https://generativelanguage.googleapis.com/v1beta/openai',model:'gemini-2.5-flash'},
 groq:{label:'Groq (มีรุ่นฟรี)',base:'https://api.groq.com/openai/v1',model:'openai/gpt-oss-120b'},
 openrouter:{label:'OpenRouter (มีรุ่น :free)',base:'https://openrouter.ai/api/v1',model:''},
 cerebras:{label:'Cerebras (มีรุ่นฟรี)',base:'https://api.cerebras.ai/v1',model:''},
 mistral:{label:'Mistral',base:'https://api.mistral.ai/v1',model:'mistral-small-latest'},
 ollama:{label:'Ollama ในเครื่อง (ต้องตั้ง OLLAMA_ORIGINS)',base:'http://localhost:11434/v1',model:''},
 custom:{label:'กำหนดเอง (OpenAI-compatible)',base:'',model:''},
 none:{label:'ไม่ใช้ช่องนี้',base:'',model:''}
};
const SLOTS={main:['ตัวละครหลัก','เขียนโพสต์/ความคิดของตัวหลัก + บทเปิด (เน้นคุณภาพ)'],npc:['NPC / ชาวเน็ต','ฉากหลังฝูงชน (เน้นเร็ว/ถูก)'],referee:['กรรมการ / อ่านสถานการณ์','ให้คะแนน วางช่วงเรื่อง สร้างเควส (เน้นทำตาม JSON)'],backup:['สำรอง','ใช้เมื่อช่องหลักล้ม/ติดโควตา/ปฏิเสธ']};
const KEY_HELP={gemini:'เอาคีย์ที่ aistudio.google.com/apikey (ล็อกอินบัญชี Google → Create API key)',groq:'เอาคีย์ที่ console.groq.com/keys',openrouter:'เอาคีย์ที่ openrouter.ai/keys (รุ่นฟรีชื่อลงท้าย :free)',cerebras:'เอาคีย์ที่ cloud.cerebras.ai',mistral:'เอาคีย์ที่ console.mistral.ai',ollama:'ไม่ต้องใช้คีย์ (ว่างได้)',custom:'ดูจากเอกสารของผู้ให้บริการ'};
const PRESET_LIMITS={groq:[200000,1000],openrouter:[0,50],cerebras:[1000000,0],gemini:[0,0],mistral:[0,0],ollama:[0,0],custom:[0,0]};
function defaultCaps(){return{world:8000,premise:2500,char:5000,player:5000,playerSend:5000,post:2000,answer:6000}}
function defaultSettings(){const mk=p=>({preset:p,base:'',key:'',model:'',temp:0.9,dailyTokens:0,dailyReqs:0});return{slots:{main:mk('demo'),npc:mk('demo'),referee:mk('demo'),backup:mk('none')},expPerLevel:40,xpScale:100,lang:'auto',tone:'medium',crowd:6,dicebear:true,caps:defaultCaps()}}
let settings=Object.assign(defaultSettings(),LS.get('ss_settings',{}));
settings.slots=Object.assign(defaultSettings().slots,settings.slots);
settings.caps=Object.assign(defaultCaps(),settings.caps||{});
if(settings.caps.playerSend===2500)settings.caps.playerSend=5000;
Object.values(settings.slots).forEach(c=>{if(c.dailyTokens==null)c.dailyTokens=0;if(c.dailyReqs==null)c.dailyReqs=0});
let worlds=LS.get('ss_worlds',[]);
let saves=LS.get('ss_saves',[]);
const persistSettings=()=>LS.set('ss_settings',settings);
const persistWorlds=()=>LS.set('ss_worlds',worlds);
const persistSaves=()=>LS.set('ss_saves',saves);

/* ---- game math: XP / skill points / followers / vibes / affinity ---- */
const xpScale=()=>Math.max(.2,(Number(settings.xpScale)||100)/100);
const xpNeed=L=>Math.max(5,Math.round((18+3*L)*xpScale()));
const xpCum=L=>{let t=0;for(let i=1;i<L;i++)t+=xpNeed(i);return t};
const levelFromXp=x=>{let L=1;while(L<100&&x>=xpCum(L+1))L++;return L};
const START_FOL={1:40,2:150,3:800,4:6000,5:60000},NPC_FOL={1:300,2:4000,3:50000,4:600000,5:6000000};
const hashN=str=>{let h=0;for(const ch of String(str))h=(h*31+ch.charCodeAt(0))>>>0;return h};
const starsFromFol=n=>n<80?1:n<500?2:n<5000?3:n<50000?4:5;
const defaultVibes=()=>[{name:'เสน่ห์',desc:'ความน่าหลงใหล/ความขำ',v:0},{name:'บารมี',desc:'ความน่าเกรงขาม/ความน่าเชื่อถือ',v:0}];
const affVal=(s,id)=>Number(s.aff&&s.aff[id])||0;
const affLabel=v=>v<=-80?'เกลียดเข้ากระดูก':v<=-50?'เกลียด':v<=-20?'ไม่ชอบ':v<20?'เฉยๆ':v<50?'เริ่มถูกใจ':v<80?'ชอบมาก':'ติดใจสุดๆ';
const affLine=(s,id)=>{const v=affVal(s,id);return v?`\n  ความรู้สึกที่มีต่อตัวเอกตอนนี้: ${affLabel(v)} (${v})`:''};
const skillLv=k=>Math.max(0,Math.min(100,Number(k&&k.pts)||0));
const skillTier=k=>{const t=k.tiers;const p=skillLv(k);if(Array.isArray(t)&&t.length>=4)return t[p<25?0:p<50?1:p<75?2:3];return k.desc||''};
const questRange=s=>{const lv=1+(s.level||1)/50;return[Math.round((8+3*4.2)*lv),Math.round((8+9*4.2)*lv)]};
function fixGates(stages){
  stages.forEach((st,i)=>{
    if(i>=stages.length-1){st.gate=[];return}
    const seen=[];(st.gate||[]).forEach(g=>{const k=clamp(g.skill,0,2);if(!seen.includes(k))seen.push(k)});
    for(const k of [0,1,2]){if(seen.length>=2)break;if(!seen.includes(k))seen.push(k)}
    const R=Math.max(1,Math.round((st.level_to||20)*.75));
    st.gate=seen.slice(0,2).map((k,j)=>({skill:k,level:j?Math.max(1,R-3):R}));
  });
}
function folOf(w,s,key){
  if(key==='me')return Math.round(s.followers||0);
  if(String(key).startsWith('x:'))return Math.round(50*Math.pow(400,(hashN(key)%1000)/1000));
  s.npcFol=s.npcFol||{};
  if(s.npcFol[key]==null){const c=w.chars.find(c=>c.id===key);s.npcFol[key]=Math.round(NPC_FOL[clamp((c&&c.fame)||3,1,5)]*(0.6+(hashN(key)%100)/100))}
  return Math.round(s.npcFol[key]);
}
function migrateSave(s){
  if(!s||s.v>=2)return s;
  const per=Math.max(5,settings.expPerLevel||40);const oldLv=Math.min(100,1+Math.floor((s.exp||0)/per));const into=((s.exp||0)%per)/per;
  s.rawLv=oldLv;s.exp=xpCum(oldLv)+(oldLv<100?Math.round(into*xpNeed(oldLv)):0);
  let spent=0;(s.skills||[]).forEach(k=>{const o=Math.min(10,1+Math.floor((k.exp||0)/25));k.pts=(o-1)*3;spent+=k.pts;delete k._up;delete k.exp});
  s.skillPts=Math.max(0,Math.round(2.5*(oldLv-1))-spent);
  s.vibes=(s.vibes&&s.vibes.length)?s.vibes:defaultVibes();
  const w=worlds.find(x=>x.id===s.worldId);const base=clamp((w&&w.player&&w.player.fame)||1,1,5);
  s.followers=s.followers!=null?s.followers:Math.round(START_FOL[base]*(1+(oldLv-1)*.08));
  s.aff=s.aff||{};s.npcFol=s.npcFol||{};
  if(s.stages&&s.stages.length)fixGates(s.stages);

async function callLLM(slotName,messages,opts={}){
  const s=settings.slots[slotName];
  if(!s||s.preset==='none')throw new Error('ช่อง "'+slotName+'" ยังไม่ได้ตั้งค่า');
  const P=PRESETS[s.preset]||{};
  const base=(s.base||P.base||'').replace(/\/+$/,'');const model=s.model||P.model;
  if(!base)throw new Error('ช่อง "'+SLOTS[slotName][0]+'": ยังไม่ได้ใส่ Base URL');
  if(!model)throw new Error('ช่อง "'+SLOTS[slotName][0]+'": ยังไม่ได้ใส่ชื่อโมเดล (กด "ดึงรายชื่อโมเดล" ในตั้งค่า)');
  const headers={'Content-Type':'application/json'};if(s.key)headers.Authorization='Bearer '+s.key;
  const body={model,messages,temperature:opts.temp??s.temp??0.9};
  let res,to;
  try{res=await Promise.race([fetch(base+'/chat/completions',{method:'POST',headers,body:JSON.stringify(body)}),new Promise((_,rej)=>{to=setTimeout(()=>rej(Object.assign(new Error('timeout'),{name:'TimeoutError'})),150000)})])}
  catch(e){throw new Error(e.name==='TimeoutError'?'หมดเวลารอโมเดล':'เชื่อมต่อไม่ได้ ('+e.message+') — เช็ก Base URL / อินเทอร์เน็ต / คีย์')}
  finally{clearTimeout(to)}
  if(!res.ok){let t='';try{t=(await res.text()).slice(0,260)}catch{}const e=new Error('HTTP '+res.status+' '+t);e.status=res.status;
    if(res.status===429&&/per day|daily|TPD|RPD|PerDay|free-models-per-day/i.test(t)){const d=new Date();d.setHours(24,0,0,0);usage.exhausted[slotId(slotName)]=d.getTime();persistUsage()}
    throw e}
  const data=await res.json();const txt=data.choices?.[0]?.message?.content;
  if(!txt)throw new Error('โมเดลตอบว่างเปล่า (อาจถูกบล็อกเนื้อหา)');
  recordUsage(slotName,data.usage,estTok(messages.map(m=>m.content).join('')),estTok(txt));
  return txt;
}
function parseJSON(txt){
  txt=String(txt).replace(/<think>[\s\S]*?<\/think>/gi,'').trim();
  const f=txt.match(/```(?:json)?\s*([\s\S]*?)```/i);if(f)txt=f[1].trim();
  const a=txt.indexOf('{'),b=txt.lastIndexOf('}');
  if(a<0||b<=a){const e=new Error('โมเดลไม่ได้ตอบเป็น JSON'+(/ขออภัย|ไม่สามารถ|sorry|cannot|can't/i.test(txt)?' (น่าจะปฏิเสธ)':''));e.parse=true;throw e}
  let s=txt.slice(a,b+1);
  try{return JSON.parse(s)}catch(e){try{return JSON.parse(s.replace(/,\s*([}\]])/g,'$1'))}catch(e2){const er=new Error('JSON เสีย: '+e2.message);er.parse=true;throw er}}
}

async function callJSON(spec){

}

const NAME_STOP=new Set(['king','queen','prince','princess','lord','lady','miss','general','master','young','little','great','grand','royal','dark','the','mister','brother','sister']);
function nameTokens(str){return String(str||'').replace(/([a-z])([A-Z])/g,'$1 $2').split(/[^A-Za-z0-9฀-๿]+/).map(t=>t.toLowerCase()).filter(t=>t.length>=4&&!/^\d+$/.test(t)&&!NAME_STOP.has(t))}
function nameClash(w,nm,handle){
  const hay=(String(nm||'')+String(handle||'')).toLowerCase().replace(/[^a-z0-9฀-๿]+/g,'');
  const nz=x=>String(x||'').toLowerCase().replace(/[^a-z0-9\u0E00-\u0E7F]+/g,'');
  for(const c of [w.player,...w.chars]){if(!c)continue;for(const t of [...nameTokens(c.name),...nameTokens(c.handle),nz(c.name),nz(c.handle)])if(t.length>=3&&hay.includes(t))return true}
  return false;
}
const ARCH=['chronic complainer: long rants, little punctuation','hype fan: ALL CAPS, emojis, exclamation marks','dry sarcastic observer: short deadpan one-liners','gossip hound who always "heard from a friend"','wholesome elder giving unsolicited advice','edgy teen: slang, abbreviations, lowercase','pedantic know-it-all who corrects people','doom-poster who assumes the worst','lurker who only asks "wait what happened?"','shipper who ships everyone with everyone','conspiracy theorist connecting random dots','overly formal professional tone','meme-poster speaking in references and jokes','self-promoter steering everything to their own business','contrarian who disagrees with the popular take','sleepy night-owl rambling at odd hours','neutral news-aggregator style, flat summaries','old-timer comparing everything to "the good old days"','laugh-crying emoji spammer who never says anything real','moral police scolding everybody','overly dramatic poet type','practical person who only cares about prices and logistics'];
function resolveAuthor(w,s,raw,extra={}){
  if(raw==null||raw==='')raw=extra.name||extra.handle;if(!raw)return null;
  raw=String(raw).trim();if(raw==='me')return null;
  const lc=raw.toLowerCase().replace(/^@/,'');
  const p=w.player;if((p.name||'').toLowerCase()===lc||(p.handle||'').toLowerCase()===lc)return null;
  const c=w.chars.find(c=>c.id===raw)||w.chars.find(c=>(c.name||'').toLowerCase()===lc||(c.handle||'').toLowerCase()===lc);
  if(c)return isActive(s,c)?c.id:null;
  const nm=(extra.name||raw).trim();const handle=String(extra.handle||raw).replace(/^@/,'').replace(/\s+/g,'_');
  if(nameClash(w,nm,handle))return null;
  let x=s.crowd.find(x=>x.handle.toLowerCase()===handle.toLowerCase())||s.crowd.find(x=>x.name===nm);
  if(!x){x={name:nm,handle,persona:extra.persona||''};s.crowd.push(x);if(s.crowd.length>40)s.crowd.shift()}
  else if(extra.persona&&!x.persona)x.persona=extra.persona;
  return 'x:'+x.handle;
}
function genCounts(followers,high){
  const F=Math.max(1,Number(followers)||1);
  const likes=Math.max(rand(0,4),Math.round(F*0.03*Math.pow(8.3,Math.random())*(high?rand(15,30)/10:1)));
  return{likes,rt:Math.round(likes*(high?rand(12,30):rand(3,18))/100)};
}
const rcShow=p=>Math.max((p.replies||[]).length,p.rc||0);
const rcFor=p=>Math.max(p.replies.length,Math.round(p.likes*rand(8,35)/1000));
function playerFame(s,w){return s.followers!=null?starsFromFol(s.followers):clamp(Number(w.player.fame)||1,1,5)}
function fameOf(w,s,key){if(key==='me')return playerFame(s,w);if(String(key).startsWith('x:'))return 2;return Number((w.chars.find(c=>c.id===key)||{}).fame)||3}
function growCounts(s){s.posts.forEach(p=>{const ago=s.turn-p.turn;if(ago<1||ago>3)return;const f=ago===1?.35:ago===2?.15:.06;const g=Math.round(p.likes*f*rand(30,100)/100);p.likes+=g;p.rt=(p.rt||0)+Math.round(g*rand(5,20)/100);if(p.rc)p.rc+=Math.round(g*rand(8,30)/1000)})}
function mkPost(s,o){const n=++s.seq;return{id:'p'+n,author:o.author,text:String(o.text||'').trim(),image:o.image||'',caption:o.caption||'',likes:Math.max(0,Math.round(Number(o.likes))||0),rt:Math.max(0,Math.round(Number(o.rt))||0),replies:[],day:s.day,clock:clock(),turn:s.turn,ord:s.turn*1000+(o.author==='me'?900:rand(0,800)),mine:o.author==='me'}}

function applyFeed(w,s,action,postRef,major,crowd){

    const ids=[];
    (Array.isArray(arr)?arr:[]).forEach(r=>{
      if(!r||!r.text||post.replies.length>=MAXR){ids.push(null);return}
      const a=resolveAuthor(w,s,r.author||r.handle||r.name,r);if(!a){ids.push(null);return}
      const ti=Math.floor(Number(r.to))||0;const toId=ti>0&&ti<=ids.length?ids[ti-1]:null;
      const rr=addReply(s,post,a,r.text,toId);ids.push(rr?rr.id:null);
      if(rr&&notifyMe)addNotif(s,{type:'reply',author:a,text:r.text,postId:post.id});
    });
  };
  const handlePosts=(arr)=>(Array.isArray(arr)?arr:[]).forEach(o=>{
    if(!o||!o.text)return;const a=resolveAuthor(w,s,o.author||o.handle||o.name,o);if(!a)return;
    const high=o.buzz==='high'||fameOf(w,s,a)>=4;const cn=genCounts(folOf(w,s,a),high);
    const p=mkPost(s,{author:a,text:o.text,caption:o.image,likes:cn.likes,rt:cn.rt});p.buzz=high?'high':'low';
    if(o.quote_of){const orig=s.posts.find(x=>x.id===String(o.quote_of).trim()&&!x.repostOf);if(orig&&orig.author!==a){p.quoteOf=orig.id;orig.rt=(orig.rt||0)+1}}
    addList(p,o.replies,false);p.rc=rcFor(p);
    s.posts.push(p);newPosts.push(p);
    if(mentionRe.test(p.text))addNotif(s,{type:'mention',author:a,text:p.text,postId:p.id});
  });
  if(action.kind==='post'&&postRef){addList(postRef,major&&major.replies_to_me,true);addList(postRef,crowd&&crowd.replies_to_me,true)}
  handlePosts(major&&major.posts);handlePosts(crowd&&crowd.posts);
  (Array.isArray(major&&major.reposts)?major.reposts:[]).slice(0,3).forEach(o=>{
    if(!o)return;const a=resolveAuthor(w,s,o.author,o);const orig=s.posts.find(x=>x.id===String(o.of||'').trim()&&!x.repostOf);
    if(!a||!orig||orig.author===a||s.posts.some(x=>x.repostOf===orig.id&&x.author===a))return;
    const p=mkPost(s,{author:a,text:'',likes:0,rt:0});p.repostOf=orig.id;orig.rt=(orig.rt||0)+1;s.posts.push(p);newPosts.push(p)});
  if(major&&major.thoughts&&typeof major.thoughts==='object')for(const[k,v]of Object.entries(major.thoughts)){const c=w.chars.find(c=>c.id===k)||w.chars.find(c=>c.name===k);if(c&&v&&isActive(s,c))s.thoughts[c.id]={text:String(v),day:s.day}}
  if(postRef)postRef.rc=rcFor(postRef);
  return newPosts;
}
async function doTurn(action){

    const fg=calcFollowers(s,ev,action);
    const affCh=[];ev.affinity.forEach(a=>{const c=w.chars.find(c=>c.id===a.id)||w.chars.find(c=>(c.name||'').toLowerCase()===a.id.toLowerCase());if(!c||!isActive(s,c)||Math.abs(a.delta)<.1)return;const old=affVal(s,c.id);const nv=clamp(Math.round((old+a.delta)*10)/10,-100,100);s.aff=s.aff||{};s.aff[c.id]=nv;const ex=affCh.find(x=>x.id===c.id);if(ex){ex.d=Math.round((ex.d+nv-old)*10)/10;ex.v=nv}else affCh.push({id:c.id,d:Math.round((nv-old)*10)/10,v:nv})});

    ev.introduce.forEach(id=>{const c=w.chars.find(c=>c.id===id);if(c)s.unlocked[c.id]=true});

    ev.new_facts.forEach(f=>s.facts.push({text:String(f.text),known_by:f.known_by||'all',day:s.day}));if(s.facts.length>60)s.facts.splice(0,s.facts.length-60);

    let postRef=null;
    if(action.kind==='post'){const pc=genCounts(s.followers,ev.score>=8);postRef=mkPost(s,{author:'me',text:action.text,image:action.image,caption:action.caption,likes:pc.likes,rt:pc.rt});postRef.buzz=ev.score>=8?'high':'low';s.posts.push(postRef)}
    else{s.questsDone[action.quest.id]=true;const q=s.quests.find(q=>q.id===action.quest.id);if(q)q.done=true}
    const needQ=!s.quests.length||levelUp||adv.length||s.quests.every(q=>q.done);
    showBusy('ชาวบ้านกำลังพิมพ์…');
    const [mj,cr,qs]=await Promise.allSettled([genMajor(w,s,action,ev),genCrowd(w,s,action,ev),needQ?genQuests(w,s):Promise.resolve(null)]);
    const warn=[];

    if(needQ){if(qs.status==='fulfilled'&&qs.value){s.quests=qs.value;s.questsNew=true}else if(qs.status==='rejected'){warn.push('เควส: '+qs.reason.message);if(s.quests.every(q=>q.done))s.quests=[]}}
    s.log.unshift({day:s.day,kind:action.kind,text:action.kind==='post'?trunc(action.text,60):'เควส: '+action.quest.title,verdict:ev.verdict,exp:expGain,skillGain:[]});if(s.log.length>30)s.log.length=30;

    persistSaves();hideBusy();ui.busy=false;

    return true;
  }catch(e){
    hideBusy();ui.busy=false;console.error(e);toast('ทำไม่สำเร็จ: '+e.message+'\n(ข้อความที่พิมพ์ยังอยู่ ลองกดอีกครั้ง หรือเช็กหน้าตั้งค่า)','err',9000);return false;
  }
}

function viewNotif(w,s){

}
function slotCard(k){

  const dis=c.preset==='demo'||c.preset==='none';
  return `<details class="card" ${c.preset==='demo'||k==='main'?'open':''}><summary>${SLOTS[k][0]} <span class="mute sm">— ${esc(c.preset==='demo'?'โหมดทดสอบ':c.preset==='none'?'ไม่ใช้':(c.model||P.model||'?'))}</span></summary>
   <div class="mute sm">${SLOTS[k][1]}</div>
   <label class="fld"><span>ผู้ให้บริการ</span><select class="inp" data-root="settings" data-b="slots.${k}.preset">${opts}</select></label>
   ${dis?'':`<label class="fld"><span>Base URL</span><input class="inp" data-root="settings" data-b="slots.${k}.base" value="${esc(c.base||P.base||'')}" placeholder="${esc(P.base||'https://.../v1')}"></label>
   <label class="fld"><span>API Key</span><small>${KEY_HELP[c.preset]||''}</small><input class="inp" type="password" autocomplete="off" data-root="settings" data-b="slots.${k}.key" value="${esc(c.key)}" placeholder="เก็บในเบราว์เซอร์นี้เท่านั้น"></label>
   <label class="fld"><span>ชื่อโมเดล</span><input class="inp" list="dl-${k}" data-root="settings" data-b="slots.${k}.model" value="${esc(c.model)}" placeholder="${esc(P.model||'กด ดึงรายชื่อโมเดล')}"><datalist id="dl-${k}">${(ui.models[k]||[]).map(m=>`<option value="${esc(m)}">`).join('')}</datalist></label>
   <div class="row wrap gap"><label class="fld grow"><span>โควตาโทเค็น/วัน (0 = ไม่เตือน)</span><input type="number" min="0" class="inp" data-root="settings" data-b="slots.${k}.dailyTokens" value="${c.dailyTokens||0}"></label><label class="fld grow"><span>โควตาคำขอ/วัน</span><input type="number" min="0" class="inp" data-root="settings" data-b="slots.${k}.dailyReqs" value="${c.dailyReqs||0}"></label></div>
   <div class="sm mute">ค่าตั้งต้นของแต่ละเจ้าเป็นตัวเลขที่ค้นเจอ อาจเปลี่ยนได้ — ปรับให้ตรงกับหน้าบัญชีของคุณ · วันนี้ช่องนี้ใช้ ${slotUse(k).calls} คำขอ / ${fmtN(slotUse(k).in+slotUse(k).out)} โทเค็น${exhaustedNow(k)?' · <b style="color:#ff9aa1">แจ้งโควตาวันหมด</b> <span data-act="clearExh" data-slot="'+k+'" style="color:var(--acc);cursor:pointer">ล้าง</span>':''}</div>
   <label class="fld"><span>Temperature (ความสุ่ม) ${c.temp}</span><input type="number" step="0.1" min="0" max="2" class="inp" data-root="settings" data-b="slots.${k}.temp" value="${c.temp}"></label>
   <div class="row wrap gap"><button class="btn sm" data-act="fetchModels" data-slot="${k}">ดึงรายชื่อโมเดล</button><button class="btn sm" data-act="testSlot" data-slot="${k}">ทดสอบ</button></div>`}</details>`;
}

function viewGame(){
  const w=curWorld(),s=curSave();const unread=s.notifs.filter(n=>!n.read).length;const openQ=s.quests.filter(q=>!q.done).length;
  let body='';
  if(ui.tab==='feed')body=`<div class="hdr"><div class="grow"><b>${esc(w.setting.platform||w.name)}</b><div class="mute sm">วันที่ ${s.day} · Lv ${s.level}${s.capped?' ⛔':''} · 👥 ${fmtC(Math.round(s.followers||0))}${s.status.length?' · '+esc(s.status.join(', ')):''}</div></div><button class="btn q ${s.questsNew?'pulse':''}" data-act="openQuests">⚔ เควส${openQ?` (${openQ})`:''}</button><button class="icon" data-act="home" title="หน้าหลัก">⌂</button></div>`+viewFeed(w,s);
  else if(ui.tab==='progress')body=`<div class="hdr"><b>⭐ ความคืบหน้า</b></div>`+viewProgress(w,s);
  else if(ui.tab==='notif')body=viewNotif(w,s);

  return `<div class="view">${body}</div>`+`<nav class="tabs"><div>${[['feed','🐦','ทวิต'],['progress','⭐','เลเวล'],['notif','🔔','แจ้งเตือน'],['settings','⚙','ตั้งค่า']].map(([k,i,l])=>`<button class="${ui.tab===k?'on':''}" data-act="tab" data-tab="${k}"><b>${i}</b>${l}${k==='notif'&&unread?`<span class="badge">${unread}</span>`:''}${k==='progress'&&(s.skillPts||0)>0?`<span class="badge" style="background:#ff9500">${s.skillPts}</span>`:''}</button>`).join('')}</div></nav>`;
}

 selQuest(el){const q=curSave().quests.find(q=>q.id===el.dataset.id);if(q&&!q.done){ui.questSel=q.id;ui.questText='';render()}},
 async submitQuest(){
  const s=curSave();const q=s.quests.find(q=>q.id===ui.questSel);const t=(ui.questText||'').trim();if(!q||!t)return toast('ตอบก่อนนะ','err');
  ui.modal=null;render();
  const ok=await doTurn({kind:'quest',text:t,quest:{id:q.id,title:q.title,situation:q.situation}});
  if(ok){ui.questText='';ui.questSel=null;render()}else{ui.modal={type:'quests'};render()}
 },
 async regenQuests(){showBusy('กำลังสร้างเควส…');try{const w=curWorld(),s=curSave();s.quests=await genQuests(w,s);persistSaves()}catch(e){toast('สร้างเควสไม่สำเร็จ: '+e.message,'err',7000)}hideBusy();render()},
 newGoal(){setNewGoal(ui.newGoalText||'')},
 gotoPost(el){ui.tab='feed';ui.modal={type:'thread',postId:el.dataset.id};ui.replyTo=null;ui.commentText='';render()},
 copyMain(){const m=settings.slots.main;['npc','referee'].forEach(k=>{settings.slots[k]=Object.assign({},m)});persistSettings();toast('คัดลอกแล้ว','ok');render()},
 async testSlot(el){const k=el.dataset.slot;showBusy('กำลังทดสอบ…');try{const t=await callLLM(k,[{role:'user',content:'ตอบสั้นๆ ว่า OK'}]);toast('✅ ใช้ได้: '+trunc(t,60),'ok')}catch(e){toast('❌ '+e.message,'err',8000)}hideBusy()},
 async fetchModels(el){
  const k=el.dataset.slot;const c=settings.slots[k];const base=(c.base||PRESETS[c.preset].base||'').replace(/\/+$/,'');
  if(!base)return toast('ใส่ Base URL ก่อน','err');
  if(!c.key&&c.preset!=='ollama')return toast('ยังไม่ได้ใส่ API Key ของช่องนี้','err');
  showBusy('กำลังดึงรายชื่อโมเดล…');
  try{const h={};if(c.key)h.Authorization='Bearer '+c.key;const r=await fetch(base+'/models',{headers:h});
    if(!r.ok){let t='';try{t=(await r.text()).slice(0,160)}catch{}throw new Error('HTTP '+r.status+(r.status===401||r.status===403?' — คีย์ไม่ถูกต้อง หรือไม่มีสิทธิ์':r.status===404?' — Base URL น่าจะผิด':'')+' '+t)}
    const d=await r.json();const ids=(d.data||d.models||[]).map(m=>String(m.id||m.name||'').replace(/^models\//,'')).filter(Boolean).sort();ui.models[k]=ids;toast('พบ '+ids.length+' โมเดล — คลิกช่องชื่อโมเดลเพื่อเลือก','ok')}
  catch(e){toast('ดึงไม่ได้: '+(e instanceof TypeError?'เบราว์เซอร์เชื่อมต่อไม่ได้ (Failed to fetch) — เช็กอินเทอร์เน็ต, Base URL, หรือว่าเบราว์เซอร์บล็อกการเรียกจากไฟล์ในเครื่อง':e.message),'err',10000)}
  hideBusy();render()}
};

/* ================= boot ================= */
if(typeof document!=='undefined'){render()}
</script>
</body>
